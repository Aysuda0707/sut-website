# =============================================================================
# Local development stack: PostgreSQL + Directus + MinIO (S3-compatible)
#
# Usage:
#   cp .env.example .env
#   docker compose up -d
#   docker compose logs -f directus
#
# Directus admin:  http://localhost:8055
# MinIO console:   http://localhost:9001
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: sut-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-directus}
      POSTGRES_USER: ${POSTGRES_USER:-directus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-directus} -d ${POSTGRES_DB:-directus}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sut-net

  minio:
    image: minio/minio:latest
    container_name: sut-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_S3_ACCESS_KEY:?STORAGE_S3_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${STORAGE_S3_SECRET_KEY:?STORAGE_S3_SECRET_KEY is required}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sut-net

  # Creates the media bucket on first boot and exits.
  minio-init:
    image: minio/mc:latest
    container_name: sut-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${STORAGE_S3_ACCESS_KEY} ${STORAGE_S3_SECRET_KEY} &&
      mc mb --ignore-existing local/${STORAGE_S3_BUCKET:-sut-archive-media} &&
      mc anonymous set download local/${STORAGE_S3_BUCKET:-sut-archive-media} &&
      echo 'MinIO bucket ready.'
      "
    networks:
      - sut-net

  directus:
    image: directus/directus:12.5.0
    container_name: sut-directus
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8055:8055"
    environment:
      # --- Core ---
      KEY: ${DIRECTUS_KEY:?DIRECTUS_KEY is required}
      SECRET: ${DIRECTUS_SECRET:?DIRECTUS_SECRET is required}
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL:?DIRECTUS_ADMIN_EMAIL is required}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD:?DIRECTUS_ADMIN_PASSWORD is required}
      PUBLIC_URL: ${DIRECTUS_URL:-http://localhost:8055}
      # --- Database ---
      DB_CLIENT: pg
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-directus}
      DB_USER: ${POSTGRES_USER:-directus}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      # --- Storage (S3 / MinIO) ---
      STORAGE_LOCATIONS: s3
      STORAGE_S3_DRIVER: s3
      STORAGE_S3_KEY: ${STORAGE_S3_ACCESS_KEY}
      STORAGE_S3_SECRET: ${STORAGE_S3_SECRET_KEY}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-sut-archive-media}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-us-east-1}
      STORAGE_S3_ENDPOINT: http://minio:9000
      STORAGE_S3_FORCE_PATH_STYLE: "true"
      # --- Media limits (bytes) ---
      FILES_MAX_UPLOAD: ${MEDIA_MAX_VIDEO_MB:-2048}mb
      # --- CORS: allow the Next.js dev server ---
      CORS_ENABLED: "true"
      CORS_ORIGIN: "http://localhost:3000"
      # --- Misc ---
      TELEMETRY: "false"
    volumes:
      - ./cms/extensions:/directus/extensions
      - ./cms/snapshots:/directus/snapshots
    networks:
      - sut-net

volumes:
  postgres_data:
  minio_data:

networks:
  sut-net:
    driver: bridge
